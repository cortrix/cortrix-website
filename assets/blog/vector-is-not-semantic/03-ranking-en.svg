<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">Who changes the order, and who decides to use it</title>
  <desc id="desc">Four candidates move from BGE ranking to final LLM ordering. The demo application then decides whether to adopt an item according to its lifecycle state. The LLM moves the v2 migration notice to first place; the application checks that it is current and keeps that result. The chosen field is buyer_account_id.</desc>
  <defs>
    <style>
      text { font-family: "PingFang SC", "Noto Sans CJK SC", sans-serif; fill: #111827; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 22px; fill: #4b5563; }
      .head { font-size: 22px; font-weight: 700; }
      .body { font-size: 22px; }
      .strong { font-size: 23px; font-weight: 700; }
      .blue { fill: #EA5000; }
      .muted { fill: #667085; }
      .orange { fill: #D97706; }
    </style>
    <style>
      svg { color-scheme:light dark; --bg:#0B0F19; --surface:#131B2A; --surface2:#1A2236; --line:#1E293B; --txt:#F1F5F9; --muted:#94A3B8; --magma:#FF6405; --magma-h:#FF8A30; --amber:#FFB020; --ok:#34D399; --warning-bg:#2A1A08; --success-bg:#092A22; }
      @media (prefers-color-scheme:light) { svg { --bg:#F8FAFC; --surface:#FFFFFF; --surface2:#F1F5F9; --line:#E2E8F0; --txt:#0F172A; --muted:#64748B; --magma:#FF6405; --magma-h:#EA5000; --amber:#D97706; --ok:#059669; --warning-bg:#FFF7ED; --success-bg:#ECFDF5; } }
      text { font-family:"Inter", "PingFang SC", "Noto Sans CJK SC", sans-serif; fill:var(--txt); } .subtitle, .muted { fill:var(--muted); } .blue { fill:var(--magma-h); } .orange { fill:var(--muted); } marker path { fill:var(--magma); }
      rect[fill="#ffffff"] { fill:var(--bg); } rect[fill="#eef3f9"], rect[fill="#fafbfc"], rect[fill="#FFF2E8"], rect[fill="#FFFDFC"] { fill:var(--surface2); stroke:var(--line); } rect[y="214"], rect[fill="#FFF7ED"] { fill:var(--surface); stroke:var(--magma); } rect[fill="#fff8f0"], rect[fill="#FFF3E5"] { fill:var(--surface2); stroke:var(--amber); } rect[fill="#eaf3ff"], rect[fill="#FFF0E6"] { fill:var(--surface); stroke:var(--magma); }
      line[stroke="#d3dae4"], line[stroke="#FED7AA"] { stroke:var(--line); } text[x="810"].blue, text[x="980"].blue, text[x="242"].blue { fill:var(--magma-h); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#FF6405"/>
    </marker>
  </defs>
  <rect width="1200" height="980" fill="#ffffff"/>
  <text x="60" y="68" class="title">Who changes the order, and who decides to use it</text>
  <text x="60" y="106" class="subtitle">August 2026 demo · 4 unique blocks · not a benchmark</text>

  <rect x="60" y="148" width="1080" height="66" fill="#FFF2E8"/>
  <text x="82" y="190" class="head">Candidate block</text>
  <text x="370" y="190" class="head">BGE rank / score</text>
  <text x="610" y="190" class="head">LLM final order</text>
  <text x="810" y="190" class="head">Lifecycle</text>
  <text x="980" y="190" class="head">Demo adoption</text>

  <rect x="60" y="214" width="1080" height="118" fill="#FFF7ED" stroke="#FF6405" stroke-width="2"/>
  <text x="82" y="263" class="strong blue">v2 migration notice</text>
  <text x="82" y="299" class="body muted">Field migration guidance</text>
  <text x="370" y="284" class="strong">#3 / 0.6197</text>
  <text x="610" y="284" class="strong blue">#1</text>
  <text x="810" y="284" class="strong blue">current</text>
  <text x="980" y="284" class="strong blue">Adopted here</text>

  <rect x="60" y="332" width="1080" height="118" fill="#FFF3E5" stroke="#D97706" stroke-width="2"/>
  <text x="82" y="381" class="strong orange">v1 guide block 0</text>
  <text x="82" y="417" class="body muted">Old guidance</text>
  <text x="370" y="402" class="strong">#1 / 0.9467</text>
  <text x="610" y="402" class="strong">#2</text>
  <text x="810" y="402" class="strong orange">superseded</text>
  <text x="980" y="402" class="strong orange">Do not use</text>

  <rect x="60" y="450" width="1080" height="118" fill="#FFF3E5" stroke="#D97706" stroke-width="2"/>
  <text x="82" y="499" class="strong orange">v1 guide block 1</text>
  <text x="82" y="535" class="body muted">Old guidance</text>
  <text x="370" y="520" class="strong">#2 / 0.6609</text>
  <text x="610" y="520" class="strong">#3</text>
  <text x="810" y="520" class="strong orange">superseded</text>
  <text x="980" y="520" class="strong orange">Do not use</text>

  <rect x="60" y="568" width="1080" height="118" fill="#FFFDFC" stroke="#E2E8F0" stroke-width="2"/>
  <text x="82" y="617" class="strong">v2 cancel notice</text>
  <text x="82" y="653" class="body muted">Current version guidance</text>
  <text x="370" y="638" class="strong">#4 / 0.0519</text>
  <text x="610" y="638" class="strong">#4</text>
  <text x="810" y="638" class="strong blue">current</text>
  <text x="980" y="620" class="body">Not the top</text>
  <text x="980" y="654" class="body">eligible item</text>

  <text x="60" y="750" class="strong blue">Order change</text>
  <text x="380" y="750" class="body">The LLM moves the notice from BGE #3 to final #1.</text>
  <line x1="60" y1="780" x2="1140" y2="780" stroke="#FED7AA" stroke-width="2"/>
  <text x="60" y="826" class="strong blue">Adoption check</text>
  <text x="380" y="826" class="body">The demo checks current and keeps the result; it does not rerank.</text>

  <rect x="60" y="866" width="1080" height="72" rx="10" fill="#FFF0E6" stroke="#FF6405" stroke-width="2"/>
  <text x="88" y="912" class="strong">Chosen field</text>
  <text x="242" y="912" class="strong blue">buyer_account_id</text>
  <text x="522" y="912" class="body muted">This is only the result of this demo.</text>
</svg>
