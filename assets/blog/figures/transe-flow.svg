<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title"><title id="title">TransE: learn a direction for a relationship</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#ff8a30"/></marker></defs><rect width="1000" height="420" rx="20" fill="#0f1728"/><text x="40" y="48" fill="#eff3fa" font-size="25" font-family="system-ui, sans-serif">TransE: learn a direction for a relationship</text><path d="M80 330H520M80 330V96" stroke="#33445d" stroke-width="2"/><path d="M160 274L418 153" fill="none" stroke="#ff8a30" stroke-width="3" marker-end="url(#arrow)"/><circle cx="160" cy="274" r="10" fill="#ff8a30"/><circle cx="418" cy="153" r="10" fill="#ff8a30"/><circle cx="320" cy="288" r="7" fill="#899ab5"/><text x="117" y="310" fill="#eff3fa" font-size="18" font-family="system-ui, sans-serif">h: Hangzhou</text><text x="396" y="125" fill="#eff3fa" font-size="18" font-family="system-ui, sans-serif">t: Zhejiang</text><text x="188" y="181" fill="#ffac67" font-size="18" font-family="system-ui, sans-serif">r: located in</text><text x="301" y="320" fill="#acbace" font-size="16" font-family="system-ui, sans-serif">Other candidate</text><text x="620" y="145" fill="#eff3fa" font-size="44" font-family="system-ui, sans-serif">h + r ≈ t</text><text x="620" y="204" fill="#eff3fa" font-size="23" font-family="system-ui, sans-serif">Score the distance</text><text x="620" y="240" fill="#eff3fa" font-size="21" font-family="system-ui, sans-serif">after applying the relation.</text><text x="620" y="303" fill="#acbace" font-size="15" font-family="system-ui, sans-serif">Illustrative example by the author</text><text x="40" y="391" fill="#acbace" font-size="14" font-family="system-ui, sans-serif">Cortrix · Reading the mechanism</text></svg>
